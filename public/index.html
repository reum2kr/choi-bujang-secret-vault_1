<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 점령된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    h2 { margin: 0 0 12px; font-size: 20px; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .notice { margin: 26px 0; padding: 18px; border: 1px solid #d07384; border-radius: 14px; color: #ffe3e8; background: #612a3544; }
    .panel { margin: 26px 0; padding: 20px; border: 1px solid #51667c; border-radius: 14px; background: #16243a; }
    form { display: grid; gap: 10px; }
    label { display: grid; gap: 4px; font-size: 14px; color: #bfd0e5; }
    input { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid #51667c; background: #0d1622; color: #ecf4ff; }
    button { font: inherit; font-weight: 700; padding: 10px 16px; border: 0; border-radius: 10px; background: #8ad8df; color: #0d1622; cursor: pointer; justify-self: start; }
    button:disabled { opacity: .6; cursor: wait; }
    .status { margin: 8px 0 0; font-size: 15px; }
    .error { color: #ffb4c0; }
    .ok { color: #9fe3b0; }
    [hidden] { display: none !important; }
    textarea { font: inherit; padding: 10px 12px; border-radius: 10px; border: 1px solid #51667c; background: #0d1622; color: #ecf4ff; min-height: 80px; resize: vertical; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .ghost { background: transparent; color: #8ad8df; border: 1px solid #8ad8df; }
    .danger { background: transparent; color: #ffb4c0; border: 1px solid #ffb4c0; }
    li span { white-space: pre-wrap; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 3단계 진짜 로그인을 붙입니다</div>
    <h1>점령된 자료실</h1>
    <p>아래 기록은 모두 실습을 위해 만든 가상 자료입니다.</p>

    <section class="panel" aria-labelledby="auth-title">
      <h2 id="auth-title">로그인</h2>
      <form id="login-form">
        <label>이메일 <input id="email" type="email" autocomplete="username" required></label>
        <label>비밀번호 <input id="password" type="password" autocomplete="current-password" required></label>
        <button id="login-button" type="submit">로그인</button>
      </form>
      <div id="signed-in" hidden>
        <p class="status ok">로그인됨: <b id="who"></b></p>
        <button id="logout-button" type="button">로그아웃</button>
      </div>
      <p id="auth-message" class="status" role="status" aria-live="polite"></p>
    </section>

    <div class="notice">서버가 로그인 토큰을 직접 검사합니다. 로그인하지 않으면 자료가 보이지 않습니다. 아직 소유자 검사는 없어서, 다른 계정도 메모 id를 알면 읽고·고치고·지울 수 있습니다(4단계에서 막습니다).</div>

    <section class="panel" id="editor-panel" aria-labelledby="editor-title" hidden>
      <h2 id="editor-title">가상 메모 추가</h2>
      <form id="note-form">
        <label>제목 <input id="note-title" maxlength="100" required></label>
        <label>내용 <textarea id="note-body" maxlength="2000"></textarea></label>
        <div class="row">
          <button id="save-button" type="submit">추가</button>
          <button id="cancel-edit" class="ghost" type="button" hidden>수정 취소</button>
        </div>
      </form>
      <p id="note-message" class="status" role="status" aria-live="polite"></p>
    </section>

    <ul id="notes" aria-live="polite"><li>로그인하면 가상 자료가 보입니다.</li></ul>
  </main>
  <script type="module">
    // 공식 Supabase SDK. URL과 publishable key는 브라우저 공개용 값입니다.
    // 서버 전용 secret key는 절대 이 파일에 넣지 않습니다.
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/+esm';

    const SUPABASE_URL = 'https://yojoqbnplvwsmqaohjfr.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_nnOsC1LS3LGw_mFyzczbew_XrF2jAoQ';
    const supabase = createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

    const form = document.querySelector('#login-form');
    const loginButton = document.querySelector('#login-button');
    const signedIn = document.querySelector('#signed-in');
    const who = document.querySelector('#who');
    const message = document.querySelector('#auth-message');
    const list = document.querySelector('#notes');

    const reasons = {
      invalid_credentials: '이메일 또는 비밀번호가 맞지 않습니다.',
      email_not_confirmed: '이메일 인증이 아직 끝나지 않은 계정입니다.',
      user_banned: '사용이 정지된 계정입니다.',
      over_request_rate_limit: '시도가 너무 많습니다. 잠시 뒤 다시 해 주세요.',
    };

    function showMessage(text, kind = '') {
      message.textContent = text;
      message.className = `status ${kind}`;
    }

    function render(session) {
      const user = session?.user;
      form.hidden = Boolean(user);
      signedIn.hidden = !user;
      who.textContent = user?.email ?? '';
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      loginButton.disabled = true;
      showMessage('로그인하는 중입니다…');
      const { error } = await supabase.auth.signInWithPassword({
        email: document.querySelector('#email').value.trim(),
        password: document.querySelector('#password').value,
      });
      loginButton.disabled = false;
      document.querySelector('#password').value = '';
      if (error) {
        showMessage(`로그인 실패: ${reasons[error.code] ?? error.message}`, 'error');
        return;
      }
      showMessage('로그인했습니다.', 'ok');
    });

    document.querySelector('#logout-button').addEventListener('click', async () => {
      const { error } = await supabase.auth.signOut();
      showMessage(error ? `로그아웃 실패: ${error.message}` : '로그아웃했습니다.', error ? 'error' : 'ok');
    });

    const editorPanel = document.querySelector('#editor-panel');
    const noteForm = document.querySelector('#note-form');
    const noteTitle = document.querySelector('#note-title');
    const noteBody = document.querySelector('#note-body');
    const saveButton = document.querySelector('#save-button');
    const cancelEdit = document.querySelector('#cancel-edit');
    const editorTitle = document.querySelector('#editor-title');
    const noteMessage = document.querySelector('#note-message');
    let currentSession = null;
    let editingId = null;

    function showNotes(text) {
      const item = document.createElement('li');
      item.textContent = text;
      list.replaceChildren(item);
    }

    function noteStatus(text, kind = '') {
      noteMessage.textContent = text;
      noteMessage.className = `status ${kind}`;
    }

    // 서버에는 SDK가 준 access token만 보냅니다. userId·role·owner_id 같은 값은 보내지 않습니다.
    async function api(path, options = {}) {
      const response = await fetch(path, {
        ...options,
        cache: 'no-store',
        headers: {
          Authorization: `Bearer ${currentSession?.access_token ?? ''}`,
          ...(options.body ? { 'Content-Type': 'application/json' } : {}),
        },
      });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.message ?? `요청이 실패했습니다 (HTTP ${response.status}).`);
      return data;
    }

    function resetEditor() {
      editingId = null;
      noteForm.reset();
      editorTitle.textContent = '가상 메모 추가';
      saveButton.textContent = '추가';
      cancelEdit.hidden = true;
    }

    function startEdit(note) {
      editingId = note.id;
      noteTitle.value = note.title;
      noteBody.value = note.body ?? '';
      editorTitle.textContent = '가상 메모 수정';
      saveButton.textContent = '수정 저장';
      cancelEdit.hidden = false;
      noteStatus('');
      noteTitle.focus();
    }

    async function loadNotes() {
      if (!currentSession?.access_token) {
        showNotes('로그인하면 가상 자료가 보입니다.');
        return;
      }
      try {
        const notes = await api('/api/notes');
        if (!Array.isArray(notes)) throw new Error('자료 형식이 맞지 않습니다.');
        if (!notes.length) return showNotes('내 메모가 없습니다. 위에서 가상 메모를 추가해 보세요.');
        list.replaceChildren(...notes.map(note => {
          const item = document.createElement('li');
          const title = document.createElement('strong');
          const content = document.createElement('span');
          const row = document.createElement('div');
          const edit = document.createElement('button');
          const remove = document.createElement('button');
          title.textContent = note.title;
          content.textContent = note.body;
          row.className = 'row';
          edit.type = remove.type = 'button';
          edit.className = 'ghost';
          remove.className = 'danger';
          edit.textContent = '수정';
          remove.textContent = '삭제';
          edit.addEventListener('click', () => startEdit(note));
          remove.addEventListener('click', async () => {
            if (!confirm(`「${note.title}」 메모를 삭제할까요?`)) return;
            try {
              await api(`/api/notes/${encodeURIComponent(note.id)}`, { method: 'DELETE' });
              if (editingId === note.id) resetEditor();
              noteStatus('삭제했습니다.', 'ok');
              await loadNotes();
            } catch (error) {
              noteStatus(`삭제 실패: ${error.message}`, 'error');
            }
          });
          row.append(edit, remove);
          item.append(title, content, row);
          return item;
        }));
      } catch (error) {
        showNotes(error.message);
      }
    }

    noteForm.addEventListener('submit', async (event) => {
      event.preventDefault();
      saveButton.disabled = true;
      const payload = JSON.stringify({ title: noteTitle.value, body: noteBody.value });
      try {
        if (editingId) {
          await api(`/api/notes/${encodeURIComponent(editingId)}`, { method: 'PUT', body: payload });
          noteStatus('수정했습니다.', 'ok');
        } else {
          await api('/api/notes', { method: 'POST', body: payload });
          noteStatus('추가했습니다.', 'ok');
        }
        resetEditor();
        await loadNotes();
      } catch (error) {
        noteStatus(`저장 실패: ${error.message}`, 'error');
      } finally {
        saveButton.disabled = false;
      }
    });
    cancelEdit.addEventListener('click', () => { resetEditor(); noteStatus(''); });

    let lastToken;
    function update(session) {
      currentSession = session;
      render(session);
      editorPanel.hidden = !session;
      if (session?.access_token === lastToken) return;
      lastToken = session?.access_token;
      if (!session) { resetEditor(); noteStatus(''); }
      loadNotes();
    }

    supabase.auth.onAuthStateChange((_event, session) => {
      // 콜백 안에서 다른 Supabase 호출을 기다리지 않도록 다음 틱으로 넘깁니다.
      setTimeout(() => update(session), 0);
    });
    const { data: { session } } = await supabase.auth.getSession();
    update(session);
  </script>
</body>
</html>
