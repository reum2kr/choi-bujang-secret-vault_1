<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101a28">
  <title>오프라인 | 최부장 비밀 자료실</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101a28; color: #ecf4ff; font-family: system-ui, sans-serif; }
    main { max-width: 520px; padding: 32px 22px; }
    p { color: #bfd0e5; line-height: 1.7; }
  </style>
</head>
<body>
  <main>
    <h1>지금은 오프라인입니다</h1>
    <p>인터넷에 연결되지 않아 자료실을 열 수 없습니다. 이 화면에는 메모나 로그인 정보가 없습니다.</p>
    <p>메모는 연결된 뒤 다시 로그인하고, 서버가 이 기기를 승인한 것을 확인한 다음에만 보입니다. 앱을 설치한 것만으로는 기기가 승인되지 않습니다.</p>
  </main>
</body>
</html>
